<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Forgot Password – PowerGrid</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tabler.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/powergrid.css') }}">
</head>
<body class="pg-auth antialiased d-flex align-items-center justify-content-center" style="min-height:100vh;">
<div class="container" style="max-width:440px;">

    <div class="text-center mb-4">
        <div class="brand-icon mb-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                 stroke-width="2" stroke="#fff" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <h2 class="fw-bold mb-1">Reset Password</h2>
        <p class="text-muted mb-0">Enter your email to receive recovery instructions</p>
    </div>

    <div class="auth-card p-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="alert alert-{{ 'danger' if category == 'danger' else ('warning' if category == 'warning' else ('success' if category == 'success' else 'info')) }} mb-3">
            {{ message }}
        </div>
        {% endfor %}
        {% endwith %}


        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label class="form-label">Registered Email Address</label>
                <input id="email" type="email" name="email" class="form-control"
                       placeholder="you@powergrid.in" required autofocus>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-semibold mb-3">
                Send Recovery Instructions
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('login') }}" class="pg-auth-link" style="font-size:0.88rem;">
                &larr; Back to Sign In
            </a>
        </div>
    </div>

</div>

<script src="{{ url_for('static', filename='js/tabler.min.js') }}"></script>
</body>
</html>
