<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Set New Password – PowerGrid</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tabler.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tabler-themes.min.css') }}">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%); min-height: 100vh; }
        .auth-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 1rem;
            backdrop-filter: blur(12px);
        }
        .brand-icon {
            width: 3.5rem; height: 3.5rem;
            background: linear-gradient(135deg, #206bc4, #2fb344);
            border-radius: 0.75rem;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .form-control {
            background: rgba(255,255,255,0.06) !important;
            border: 1px solid rgba(255,255,255,0.15) !important;
            color: #e2e8f0 !important;
        }
        .form-control::placeholder { color: rgba(255,255,255,0.35) !important; }
        .form-control:focus { box-shadow: 0 0 0 3px rgba(32,107,196,0.3) !important; }
        .form-label { color: rgba(255,255,255,0.65); font-size: 0.82rem; }
        .btn-primary { background: linear-gradient(135deg,#206bc4,#1a56a8); border: none; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(32,107,196,0.4); }
        h2 { color: #f1f5f9; }
        .text-muted { color: rgba(255,255,255,0.45) !important; }
        .alert { border-radius: 0.6rem; }
    </style>
</head>
<body class="antialiased d-flex align-items-center justify-content-center" style="min-height:100vh;">
<div class="container" style="max-width:440px;">

    <div class="text-center mb-4">
        <div class="brand-icon mb-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                 stroke-width="2" stroke="#fff" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 10v4"></path>
                <circle cx="12" cy="16" r="1"></circle>
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <h2 class="fw-bold mb-1">Set New Password</h2>
        <p class="text-muted mb-0">For account: <strong class="text-light">{{ user.username }}</strong> ({{ user.email }})</p>
    </div>

    <div class="auth-card p-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="alert alert-{{ 'danger' if category == 'danger' else 'info' }} mb-3">
            {{ message }}
        </div>
        {% endfor %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input id="password" type="password" name="password" class="form-control"
                       placeholder="Min 6 characters" required autofocus>
            </div>

            <div class="mb-4">
                <label class="form-label">Confirm New Password</label>
                <input id="confirm_password" type="password" name="confirm_password" class="form-control"
                       placeholder="Repeat new password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-semibold">
                Update Password &amp; Sign In
            </button>
        </form>
    </div>

</div>

<script src="{{ url_for('static', filename='js/tabler.min.js') }}"></script>
</body>
</html>
